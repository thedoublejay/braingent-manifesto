name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: "Successful Python Package workflow run ID containing braingent-dist artifact"
        required: true
        type: string
      sha:
        description: "Commit SHA used in the artifact name"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download build-once artifacts
        uses: actions/download-artifact@v8
        with:
          name: braingent-dist-${{ inputs.sha }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          packages-dir: dist
          attestations: true
